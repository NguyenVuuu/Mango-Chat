name: ci

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  backend:
    if: hashFiles('backend/package-lock.json') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t jwt-backend ./backend

  frontend:
    if: hashFiles('frontend/package-lock.json') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        env:
          VITE_API_URL: /api
          VITE_SOCKET_URL: /socket.io
        run: npm run build

      - name: Build frontend Docker image
        run: docker build --build-arg VITE_API_URL=/api --build-arg VITE_SOCKET_URL=/socket.io -t jwt-frontend ./frontend